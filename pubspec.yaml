name: breathe
description: "A breathing excercise app."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.4
  get: ^4.7.3
  gap: ^3.0.1
  just_audio: ^0.10.5
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0  
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#fffff"
    theme_color: "#fffff"

flutter:
  uses-material-design: true
  assets:
    - assets/artworks/
    - assets/icons/
    - assets/sounds/
    - assets/animations/
  fonts:
    - family: Lato
      fonts:
        - asset: fonts/lato/Lato-Light.ttf
          weight: 300
        - asset: fonts/lato/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: fonts/lato/Lato-Regular.ttf
          weight: 400
        - asset: fonts/lato/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: fonts/lato/Lato-Bold.ttf
          weight: 700
    - family: Quicksand
      fonts:
        - asset: fonts/quicksand/Quicksand-Light.ttf
          weight: 300
        - asset: fonts/quicksand/Quicksand-Regular.ttf
          weight: 400
        - asset: fonts/quicksand/Quicksand-Medium.ttf
          weight: 500
        - asset: fonts/quicksand/Quicksand-SemiBold.ttf
          weight: 600
        - asset: fonts/quicksand/Quicksand-Bold.ttf
          weight: 700